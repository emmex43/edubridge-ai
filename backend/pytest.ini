[pytest]
pythonpath = .
testpaths = tests
# The `live` marker was declared but never acted on, so a plain `pytest` ran the
# end-to-end tests against the real provider: a fresh clone spent the
# maintainer's credits on the first run and failed outright once a daily quota
# ran out. Deselecting by default is what the marker was for. Run them
# deliberately with `pytest -m live` (the command line overrides this).
addopts = -m "not live"
markers =
    live: hits the real provider API (costs money, needs a valid key). Runs with `pytest -m live`.
