# Render Blueprint for the EduBridge AI backend.
#
# Render reads this file from the repository root when you choose
# "New +" -> "Blueprint" and point it at this repo. It creates the web service
# with the build/start commands and the environment variables below already
# configured. See DEPLOYMENT.md for the walkthrough and for what each variable
# means.
#
# No secret is stored here. Variables marked `sync: false` are left blank in the
# dashboard for you to paste in during setup; JWT_SECRET_KEY is generated by
# Render. Nothing in this file should ever need to be edited to add a key.

services:
  - type: web
    name: edubridge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render assigns the port through $PORT and expects the process to bind
    # 0.0.0.0; binding 127.0.0.1 here makes the service unreachable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- secrets: fill these in the Render dashboard, never in this file ---
      # The key for whichever provider OPENAI_BASE_URL points at.
      - key: OPENAI_API_KEY
        sync: false
      # The Postgres connection string. Must start with postgresql:// and
      # include ?sslmode=require for a hosted database.
      - key: DATABASE_URL
        sync: false
      # The deployed frontend's origin, e.g. https://your-app.vercel.app
      # Comma-separated if there is more than one. Without this the browser
      # blocks every call with a CORS error and the server log shows nothing.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- generated ---
      # Render invents a long random value, so the "dev-secret-change-this"
      # default never reaches production.
      - key: JWT_SECRET_KEY
        generateValue: true

      # --- provider: these are the values the project currently runs on ---
      # Delete OPENAI_BASE_URL to talk to OpenAI itself instead of Groq, and
      # swap the model IDs for OpenAI's (gpt-4o / whisper-1 / tts-1).
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: TTS_VOICE
        value: hannah
      # Orpheus on Groq emits wav only; leaving this at the mp3 default would
      # publish clips whose extension lies about their bytes.
      - key: TTS_FORMAT
        value: wav
      # Groq has no embeddings endpoint. Blank makes RAG skip the round-trip
      # and hand the model the module material unranked. It does not disable RAG.
      - key: EMBEDDING_MODEL
        value: ""
